<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Java Exercises Book</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container">

    <header class="header">
        <h1>☕ Java Exercises Book</h1>

        <p>
            Minha jornada de aprendizado em Java.
        </p>
    </header>

    <main>

        <h2>Meus estudos</h2>

        <div class="temas">

            <section
                    class="tema"
                    th:each="tema : ${temas}"
            >

                <div class="tema-header">

                <span
                        class="tema-icone"
                        th:text="${tema.icone}"
                >
                    ☕
                </span>

                    <div>

                        <h2 th:text="${tema.nome}">
                            Nome do tema
                        </h2>

                        <p th:text="${tema.descricao}">
                            Descrição do tema
                        </p>

                    </div>

                </div>


                <div class="capitulos">

                    <a
                            class="capitulo-card"
                            th:each="capitulo : ${tema.capitulos}"
                            th:href="${capitulo.url}"
                    >

                        <h3 th:text="${capitulo.nome}">
                            Nome do capítulo
                        </h3>

                        <p th:text="${capitulo.descricao}">
                            Descrição do capítulo
                        </p>

                    </a>

                </div>

            </section>

        </div>

    </main>

</div>

</body>
</html>
