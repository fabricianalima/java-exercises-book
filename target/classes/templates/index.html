<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Java Exercises Book</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container">

    <header class="header">
        <h1>☕ Java Exercises Book</h1>

        <p>
            Minha jornada de aprendizado em Java.
        </p>
    </header>

    <main>

        <h2>Capítulos</h2>

        <div class="capitulos">

            <a
                    class="capitulo-card"
                    th:each="capitulo : ${capitulos}"
                    th:href="${capitulo.url}"
            >

                <h2 th:text="${capitulo.nome}">
                    Nome do capítulo
                </h2>

                <p th:text="${capitulo.descricao}">
                    Descrição do capítulo
                </p>

            </a>

        </div>

    </main>

</div>

</body>
</html>
