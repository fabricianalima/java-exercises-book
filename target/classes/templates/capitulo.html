<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <title>Java Exercises Book</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <!-- Highlight.js -->
    <link
            rel="stylesheet"
            th:href="@{/webjars/highlightjs__cdn-assets/11.11.1/styles/github-dark.min.css}"
    >
</head>

<body>

<div class="container">

    <a class="voltar" href="/">
        ← Voltar para os capítulos
    </a>

    <article class="conteudo">

        <div th:utext="${conteudo}"></div>

    </article>

</div>

<!-- Highlight.js -->
<script
        th:src="@{/webjars/highlightjs__cdn-assets/11.11.1/highlight.min.js}">
</script>

<script>
    hljs.highlightAll();

    document.querySelectorAll('.conteudo pre').forEach(pre => {

        const wrapper = document.createElement('div');
        wrapper.className = 'codigo-wrapper';

        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);

        const botao = document.createElement('button');

        botao.className = 'botao-copiar';
        botao.textContent = 'Copiar';

        botao.addEventListener('click', async () => {

            const codigo = pre.querySelector('code').innerText;

            await navigator.clipboard.writeText(codigo);

            botao.textContent = '✓ Copiado!';

            setTimeout(() => {
                botao.textContent = 'Copiar';
            }, 2000);
        });

        wrapper.appendChild(botao);
    });
</script>

</body>

</html>
